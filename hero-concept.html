<style>
:root{ --ink:#16191B; --blue:#0055FF; }
*{ box-sizing:border-box; }
html,body{ margin:0; background:#fff; font-family:Manrope,system-ui,sans-serif; color:var(--ink); }
.hero{ min-height:100svh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:clamp(16px,3vw,48px); gap:clamp(8px,2vw,28px); position:relative; }
.draw{ width:min(1320px,100%); height:auto; overflow:visible; }
.sh{ fill:var(--fc,none); fill-opacity:0; stroke:var(--blue); stroke-width:2.4; stroke-linejoin:round; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1;
  animation:draw 1.3s var(--d) cubic-bezier(.45,.1,.3,1) forwards, fillIn .9s var(--fd,5.2s) ease forwards, tone .9s 5.2s ease forwards; }
.nf{ fill:none !important; animation:draw 1.3s var(--d) cubic-bezier(.45,.1,.3,1) forwards, tone .9s 5.2s ease forwards; }
.thin{ stroke-width:1.2; }
.wall,.back{ --fd:4.8s; } .seg,.orange,.glass{ --fd:5.3s; } .gl,.col,.pillar,.win{ --fd:5.7s; }
.keep{ animation:draw 1.3s var(--d) cubic-bezier(.45,.1,.3,1) forwards, toneK .9s 5.2s ease forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }
@keyframes fillIn{ to{ fill-opacity:1; } }
@keyframes tone{ to{ stroke:#26303C; stroke-opacity:.3; } }
@keyframes toneK{ to{ stroke:#26303C; stroke-opacity:.9; } }
.dimg{ opacity:0; animation:dimIO 5s .2s forwards; }
.dimg line{ stroke:var(--blue); stroke-width:1.6; } .dimg .axis{ stroke-dasharray:10 6; opacity:.6; }
.dimg text{ fill:var(--blue); font:400 20px 'Days One',Manrope,sans-serif; letter-spacing:.14em; }
@keyframes dimIO{ 0%{opacity:0} 12%{opacity:1} 85%{opacity:1} 100%{opacity:0} }
.dec{ opacity:0; transform-box:fill-box; transform-origin:50% 60%; transform:translateY(10px) scale(.9); animation:decIn .65s var(--dd) cubic-bezier(.2,1.3,.4,1) forwards; }
@keyframes decIn{ to{ opacity:1; transform:none; } }
.sg{ fill:#fff; font-family:Manrope,sans-serif; filter:drop-shadow(0 2px 2px rgba(80,20,0,.35)); } .sm{ font:700 11px Manrope,sans-serif; fill:#fff; letter-spacing:.02em; } .tilegrid line{ stroke:#B8481A; stroke-width:1; opacity:.3; } .t1{ font:700 20px Manrope,sans-serif; fill:#fff; } .t2{ font:800 27px Manrope,sans-serif; fill:#fff; letter-spacing:.01em; } .t3{ font:700 8.5px Manrope,sans-serif; fill:#fff; opacity:.9; }
.cap{ text-align:center; opacity:0; animation:fadeIn .8s 6.6s forwards; }
.cap p{ margin:0 0 8px; font:400 13px 'Days One',Manrope,sans-serif; letter-spacing:.1em; text-transform:uppercase; color:#5B6472; }
.cap h1{ margin:0; font-weight:800; font-size:clamp(24px,3.4vw,50px); line-height:1.05; letter-spacing:-.03em; }
@keyframes fadeIn{ to{ opacity:1; } }
.again{ position:absolute; right:clamp(16px,3vw,40px); top:clamp(16px,3vw,40px); background:#fff; color:var(--ink); border:1px solid #D5D9E0; border-radius:999px; padding:10px 16px; font:700 13px Manrope,sans-serif; cursor:pointer; }
@media(prefers-reduced-motion:reduce){ *{ animation-duration:.01s !important; animation-delay:0s !important; } }
</style>
