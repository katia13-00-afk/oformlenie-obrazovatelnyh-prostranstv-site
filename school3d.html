<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Days+One&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{ --ink:#16191B; --muted:#5B6472; --blue:#0055FF; --orange:#FB4903; --yellow:#FFD21F; --green:#1FA24A; --red:#E5252A; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:#fff; color:var(--ink); font-family:Manrope,Helvetica,Arial,sans-serif; overflow:hidden; }
#stage{ position:fixed; inset:0; touch-action:none; cursor:grab; }
#stage.drag{ cursor:grabbing; }
canvas{ display:block; width:100%; height:100%; }
.top{ position:fixed; left:clamp(16px,3vw,48px); top:clamp(16px,3vh,36px); z-index:5; display:flex; flex-direction:column; gap:10px; pointer-events:none; }
.top h1{ margin:0; font-size:clamp(22px,2.6vw,44px); font-weight:800; letter-spacing:-.03em; line-height:1.05; }
.top p{ margin:0; max-width:34ch; font-size:clamp(13px,1vw,16px); color:var(--muted); line-height:1.4; }
.home{ position:fixed; right:clamp(16px,3vw,48px); top:clamp(16px,3vh,36px); z-index:6; text-decoration:none; color:var(--ink); font-weight:600; font-size:14px; padding:.7em 1.1em; border-radius:10px; background:#fff; box-shadow:0 0 0 .5px rgba(0,30,90,.12), 0 2px 3px rgba(0,30,90,.08); }
.back{ position:fixed; left:clamp(16px,3vw,48px); bottom:clamp(16px,3vh,36px); z-index:6; border:0; cursor:pointer; font:600 14px Manrope,sans-serif; color:#fff; background:var(--blue); padding:.8em 1.2em; border-radius:10px; opacity:0; visibility:hidden; transition:opacity .3s; }
.back.on{ opacity:1; visibility:visible; }
.hint{ position:fixed; left:50%; bottom:clamp(14px,2.6vh,30px); transform:translateX(-50%); z-index:4; font-size:13px; color:var(--muted); background:rgba(255,255,255,.85); padding:.55em 1em; border-radius:999px; pointer-events:none; text-align:center; }
.fade{ position:fixed; inset:0; background:#fff; z-index:8; opacity:0; pointer-events:none; transition:opacity .35s ease; }
.fade.on{ opacity:1; }
.hs{ all:unset; box-sizing:border-box; position:fixed; left:0; top:0; z-index:4; cursor:pointer; display:inline-flex; align-items:center; gap:.6em; padding:.5em .5em .5em .55em; border-radius:999px; background:var(--t); border:1px solid color-mix(in srgb, var(--c) 40%, transparent);
  font:500 clamp(12px,.95vw,16px)/1 Manrope,sans-serif; color:var(--ink); white-space:nowrap; will-change:transform; transition:opacity .25s, border-color .2s, background .2s; }
.hs:hover{ border-color:var(--c); }
.hs:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
.hs i{ width:1.2em; height:1.2em; border-radius:.35em; background:var(--c); flex:none; }
.hs u{ position:relative; width:1.7em; height:1.7em; border-radius:50%; border:1px solid color-mix(in srgb, var(--c) 55%, var(--ink)); background:rgba(255,255,255,.6); flex:none; }
.hs u::before,.hs u::after{ content:""; position:absolute; left:50%; top:50%; width:.7em; height:1.5px; background:var(--ink); transform:translate(-50%,-50%); }
.hs u::after{ transform:translate(-50%,-50%) rotate(90deg); }
.hs.hide{ opacity:0; pointer-events:none; }
.hs.go u{ background:var(--c); border-color:var(--c); }
.hs.go u::before,.hs.go u::after{ background:#fff; }
.card{ position:fixed; z-index:7; left:0; top:0; width:clamp(230px,19vw,320px); background:#fff; border-radius:16px; padding:1em 1.15em 1.05em; display:none; flex-direction:column; gap:.5em;
  box-shadow:0 0 0 .5px rgba(0,30,90,.1), 0 14px 34px -14px rgba(0,30,90,.35); font-size:14px; line-height:1.4; }
.card.on{ display:flex; }
.card strong{ font-weight:700; } .card em{ font-style:normal; color:var(--muted); }
.card a{ align-self:flex-start; color:var(--blue); font-weight:600; text-decoration:none; } .card a:hover{ text-decoration:underline; }
.card button{ all:unset; cursor:pointer; position:absolute; right:.7em; top:.55em; font-size:18px; color:var(--muted); }
.note{ position:fixed; right:clamp(16px,3vw,48px); bottom:clamp(14px,2.6vh,30px); z-index:4; font-size:11px; color:#8A93A1; pointer-events:none; }
@media(max-width:700px){ .top p{ display:none; } .hint{ font-size:11px; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="top"><h1>Школа изнутри</h1><p id="sub">Нажмите на подписи на здании: зайдите в коридор или кабинет и посмотрите, как работает навигация.</p></div>
<a class="home" href="index.html">← На сайт</a>
<button class="back" id="back" type="button">← К зданию</button>
<div class="hint" id="hint">Перетаскивайте, чтобы повернуть</div>
<div class="note">Иллюстрация. Здание и интерьеры условные</div>
<div class="card" id="card" role="dialog"><button type="button" id="cardX" aria-label="Закрыть">×</button><strong id="cT"></strong><em id="cP"></em><a href="index.html#project-gallery">Смотреть решения →</a></div>
<div class="fade" id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var INK='#16191B', P={blue:'#0055FF',orange:'#FB4903',yellow:'#FFD21F',green:'#1FA24A',red:'#E5252A'};
var TINT={blue:'#DCE8FF',orange:'#FFE2D5',yellow:'#FFF3C2',green:'#D9F2E0',red:'#FFDCDC'};
var stage=document.getElementById('stage'), fade=document.getElementById('fade'), card=document.getElementById('card');
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

/* ——— помощники ——— */
function M(c,o){ return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0},o||{})); }
function box(w,h,d,x,y,z,mat,parent,shadow){ var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); if(shadow!==false){ m.castShadow=true; m.receiveShadow=true; } parent.add(m); return m; }
function plane(w,h,x,y,z,mat,parent,ry,rx){ var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat); m.position.set(x,y,z); if(ry) m.rotation.y=ry; if(rx) m.rotation.x=rx; parent.add(m); return m; }
function tex(w,h,draw){ var c=document.createElement('canvas'); c.width=w; c.height=h; var x=c.getContext('2d'); draw(x,w,h); var t=new THREE.CanvasTexture(c); t.anisotropy=8; return t; }
function signTex(lines,bg,fg,w,h,fonts){ return tex(w,h,function(x,W,H){ x.fillStyle=bg; x.fillRect(0,0,W,H); x.fillStyle=fg; x.textAlign='center'; x.textBaseline='middle';
  lines.forEach(function(l,i){ var f=(fonts&&fonts[i])||'700 '+Math.round(H/(lines.length+.6))+'px Manrope'; x.font=f; x.fillText(l,W/2,H*(i+1)/(lines.length+1)); }); }); }
function basic(t){ return new THREE.MeshBasicMaterial({map:t}); }
function look(cam,x,y,z){ cam.lookAt(x,y,z); }
function ease(t){ return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }

var HS=[]; // хотспоты текущего режима
var hsLayer=document.body;
function addHS(h){ var b=document.createElement('button'); b.type='button'; b.className='hs'+(h.go?' go':''); b.style.setProperty('--c',P[h.col]); b.style.setProperty('--t',TINT[h.col]);
  b.innerHTML='<i></i>'+h.label+'<u></u>'; h.el=b; h.v=new THREE.Vector3(h.pos[0],h.pos[1],h.pos[2]); hsLayer.appendChild(b);
  b.addEventListener('click',function(e){ e.stopPropagation(); if(busy) return; if(h.go) zoomTo(h); else showCard(h); }); HS.push(h); }
function clearHS(){ HS.forEach(function(h){ h.el.remove(); }); HS=[]; hideCard(); }
function showCard(h){ document.getElementById('cT').textContent=h.card[0]; document.getElementById('cP').textContent=h.card[1]||''; card.classList.add('on'); card._h=h; placeCard(); }
function hideCard(){ card.classList.remove('on'); card._h=null; }
function placeCard(){ var h=card._h; if(!h) return; var r=h.el.getBoundingClientRect(); var w=card.offsetWidth, hh=card.offsetHeight;
  var x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8), y=r.top-hh-10; if(y<8) y=r.bottom+10; card.style.transform='translate('+x+'px,'+y+'px)'; }
document.getElementById('cardX').addEventListener('click',hideCard);
document.addEventListener('keydown',function(e){ if(e.key==='Escape') hideCard(); });
stage.addEventListener('pointerdown',function(){ hideCard(); });

/* ——— сцена 1: здание снаружи ——— */
function buildExterior(){
  var s=new THREE.Scene(); var g=new THREE.Group(); s.add(g);
  s.add(new THREE.HemisphereLight(0xffffff,0xdfe6ee,.62));
  var sun=new THREE.DirectionalLight(0xffffff,.55); sun.position.set(14,24,20); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
  var sc=sun.shadow.camera; sc.left=-26; sc.right=26; sc.top=22; sc.bottom=-22; sc.near=1; sc.far=80; sun.shadow.bias=-.0004; s.add(sun);
  var ground=new THREE.Mesh(new THREE.PlaneGeometry(120,80),new THREE.ShadowMaterial({opacity:.16})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; s.add(ground);
  var wall=M('#F3F2F5'), grey=M('#A9AEB6'), dark=M('#3B4452'), white=M('#FFFFFF'), tan=M('#D0B38C'), orange=M('#E5581E'), orangeD=M('#B9461A');
  var glass=new THREE.MeshPhongMaterial({color:0x6D8296,shininess:90,specular:0xbfd0e0});
  // крылья
  [-1,1].forEach(function(sd){
    box(9,6.4,5,sd*10.5,3.2,-2.5,wall,g); box(9.4,.3,5.3,sd*10.5,6.55,-2.5,grey,g);
  });
  function win(x,y,w,h){ box(w,h,.1,x,y,.05,dark,g); box(w+.22,.1,.28,x,y-h/2-.05,.12,white,g); box(.06,h,.12,x-w/6,y,.1,white,g); box(.06,h,.12,x+w/6,y,.1,white,g); box(w,.06,.12,x,y+.1,.1,white,g); }
  [-12.8,-11.2,-9.6,7.5,9.1].forEach(function(x){ win(x,1.9,1.4,2.1); win(x,5.0,1.4,2.1); });
  box(1.2,6.4,.3,-14.5,3.2,.1,M('#E8641F'),g); box(1.2,6.4,.3,14.4,3.2,.1,M('#7DA33C'),g);
  [-14.5,14.4].forEach(function(x){ [1.9,5.0].forEach(function(y){ box(.34,1.9,.1,x-.24,y,.28,dark,g); box(.34,1.9,.1,x+.24,y,.28,dark,g); }); });
  box(2.2,6.4,.3,-7.1,3.2,.1,tan,g);
  // мурал на правом крыле
  var murTex=new THREE.TextureLoader().load('img/main/wall-print-art.jpg'); var mur=plane(4.2,4.6,12,3.3,.18,new THREE.MeshBasicMaterial({map:murTex}),g);
  box(4.4,4.8,.08,12,3.3,.12,white,g);
  // центральный объём: верхний этаж выступает вперёд над колоннами
  box(12,3.5,6.5,0,1.75,-1.75,M('#EFEBE5'),g);
  box(12,4.1,8.5,0,5.55,-.75,orange,g); box(12.4,.3,8.9,0,7.75,-.75,grey,g);
  // ленточное остекление
  box(10.8,1.6,.12,0,5.2,3.52,glass,g,false);
  [-4.05,-1.35,1.35,4.05].forEach(function(x){ box(.32,1.6,.2,x,5.2,3.58,M('#F0F2F4'),g); });
  box(11.0,.1,.2,0,6.05,3.58,M('#8A93A1'),g,false); box(11.0,.1,.2,0,4.35,3.58,M('#8A93A1'),g,false);
  var doorM=M('#4F5C68',{roughness:.25,metalness:.2});
  [-4.1,-1.35,1.35,4.1].forEach(function(x,i){ var w=i==1||i==2?2.0:1.9; box(w,2.5,.1,x,1.3,1.7,doorM,g); box(.05,2.5,.12,x,1.3,1.76,white,g); });
  box(1.1,2.5,.1,-5.25,1.3,1.7,M('#4A5662'),g); box(1.1,2.5,.1,5.25,1.3,1.7,M('#4A5662'),g);
  [-5.8,-2.7,0,2.7,5.8].forEach(function(x){ box(.7,3.4,.7,x,1.7,3.2,tan,g); });
  box(12.2,.25,3.6,0,3.55,1.7,orangeD,g);
  // вывеска
  var signT=tex(1024,256,function(x,W,H){ x.fillStyle='#E5581E'; x.fillRect(0,0,W,H); x.fillStyle='#fff'; x.textBaseline='alphabetic';
    x.font='600 54px Manrope'; x.fillText('школа',250,100); x.font='800 104px Manrope'; x.fillText('ОТКРЫТИЕ',244,196);
    x.fillStyle='#fff'; x.fillRect(60,70,120,18); x.fillRect(60,100,120,18); x.fillRect(60,130,120,18); });
  plane(4.6,1.15,-3.6,6.8,3.54,basic(signT),g);
  // подпись справа
  var small=tex(512,128,function(x,W,H){ x.fillStyle='#E5581E'; x.fillRect(0,0,W,H); x.fillStyle='#fff'; x.font='700 22px Manrope'; x.fillText('МАОУ СРЕДНЯЯ',20,40); x.fillText('ОБЩЕОБРАЗОВАТЕЛЬНАЯ',20,72); x.fillText('ШКОЛА Г. СУЗДАЛЯ',20,104); });
  plane(2.6,.65,3.9,6.9,3.54,basic(small),g);
  return {scene:s,group:g};
}

/* ——— сцена 2: коридор ——— */
function buildCorridor(){
  var s=new THREE.Scene(); s.background=new THREE.Color('#EEF1F5');
  s.add(new THREE.HemisphereLight(0xffffff,0xc9d0da,.5));
  var W=3.6,H=3.1,L=34;
  [-2,-8,-14,-20,-26].forEach(function(z){ var l=new THREE.PointLight(0xffffff,.28,12); l.position.set(0,2.9,z); s.add(l); box(1.6,.04,.4,0,H-.02,z,new THREE.MeshBasicMaterial({color:0xffffff}),s,false); });
  var floorT=tex(256,256,function(x,w,h){ x.fillStyle='#D9DEE6'; x.fillRect(0,0,w,h); x.strokeStyle='#C6CCD6'; x.lineWidth=2; x.strokeRect(0,0,w,h); }); floorT.wrapS=floorT.wrapT=THREE.RepeatWrapping; floorT.repeat.set(W/1.2,L/1.2);
  plane(W,L,0,0,-L/2,new THREE.MeshStandardMaterial({map:floorT,roughness:.5}),s,0,-Math.PI/2);
  plane(W,L,0,H,-L/2,M('#F1F3F7'),s,0,Math.PI/2);
  var wallM=M('#E4E8EE');
  plane(L,H,-W/2,H/2,-L/2,wallM,s,Math.PI/2); plane(L,H,W/2,H/2,-L/2,wallM,s,-Math.PI/2);
  box(L,.14,.03,-W/2+.02,.07,-L/2,M('#C8CED8'),s,false);
  var cols=['blue','orange','green','yellow','red'];
  for(var i=0;i<8;i++){ var z=-3.2-i*3.7, c=cols[i%5];
    box(.08,2.15,1.05,-W/2+.04,1.08,z,M('#D8C2A2'),s,false); box(.04,2.25,1.2,-W/2+.03,1.12,z,M('#fff'),s,false);
    var pl=plane(.7,.32,-W/2+.07,2.42,z,basic(signTex(['Каб. '+(101+i)],P[c],c==='yellow'?INK:'#fff',256,116,['800 56px Manrope'])),s,Math.PI/2);
    // окна справа
    if(i%2===0){ box(.05,1.5,1.7,W/2-.03,1.7,z,new THREE.MeshBasicMaterial({color:0xDCE9F7}),s,false); box(.06,.06,1.8,W/2-.03,2.47,z,M('#fff'),s,false); box(.06,.06,1.8,W/2-.03,.93,z,M('#fff'),s,false); box(.06,1.5,.05,W/2-.03,1.7,z,M('#fff'),s,false); }
  }
  var murT=new THREE.TextureLoader().load('img/main/wall-print-art.jpg'); plane(5.2,2.3,W/2-.02,1.55,-15.6,new THREE.MeshBasicMaterial({map:murT}),s,-Math.PI/2);
  // подвесные указатели
  function hang(z,lines,bg,fg){ var t=signTex(lines,bg,fg,768,230,['800 78px Manrope','600 46px Manrope']); box(1.9,.58,.05,0,2.55,z,M('#fff'),s,false); plane(1.84,.52,0,2.55,z+.03,basic(t),s); box(.03,.5,.03,-.7,2.95,z,M('#8A93A1'),s,false); box(.03,.5,.03,.7,2.95,z,M('#8A93A1'),s,false); }
  hang(-7.5,['Кабинеты 101–108','→'],P.blue,'#fff'); hang(-15,['← Библиотека','Столовая →'],P.orange,'#fff'); hang(-23,['Актовый зал','↑'],P.green,'#fff');
  // стрелки на полу
  [[-5,'→'],[-11,'↑']].forEach(function(a){ var t=tex(256,256,function(x,w,h){ x.clearRect(0,0,w,h); x.fillStyle=P.blue; x.font='700 200px Manrope'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(a[1],w/2,h/2+8); });
    var m=plane(.9,.9,0,.01,a[0],new THREE.MeshBasicMaterial({map:t,transparent:true}),s,0,-Math.PI/2); });
  // торец: номер этажа
  var end=tex(1024,640,function(x,W,H){ x.fillStyle=P.yellow; x.fillRect(0,0,W,H); x.fillStyle=INK; x.textAlign='center'; x.textBaseline='middle'; x.font='400 420px "Days One"'; x.fillText('2',W/2-110,H/2+10); x.font='400 110px "Days One"'; x.fillText('этаж',W/2+210,H/2+110); });
  plane(W,H,0,H/2,-L+.01,basic(end),s);
  return {scene:s,L:L};
}

/* ——— сцена 3: кабинет ——— */
function buildClass(){
  var s=new THREE.Scene(); s.background=new THREE.Color('#EEF1F5');
  s.add(new THREE.HemisphereLight(0xffffff,0xc9d0da,.55));
  var W=8.4,D=8.6,H=3.2;
  [-1.5,2.2].forEach(function(z){ [-2,2].forEach(function(x){ var l=new THREE.PointLight(0xffffff,.25,10); l.position.set(x,3,z); s.add(l); box(1.5,.04,.35,x,H-.02,z,new THREE.MeshBasicMaterial({color:0xffffff}),s,false); }); });
  plane(W,D,0,0,0,M('#D8C2A2',{roughness:.6}),s,0,-Math.PI/2); plane(W,D,0,H,0,M('#F1F3F7'),s,0,Math.PI/2);
  var wm=M('#E4E8EE');
  plane(W,H,0,H/2,-D/2,wm,s); plane(W,H,0,H/2,D/2,wm,s,Math.PI); plane(D,H,-W/2,H/2,0,wm,s,Math.PI/2); plane(D,H,W/2,H/2,0,wm,s,-Math.PI/2);
  // доска
  box(4.6,1.3,.06,0,1.65,-D/2+.04,M('#2E3A3F'),s,false); box(4.8,.06,.1,0,.99,-D/2+.05,M('#fff'),s,false);
  var bt=tex(1024,288,function(x,W,H){ x.fillStyle='#2E3A3F'; x.fillRect(0,0,W,H); x.fillStyle='rgba(255,255,255,.85)'; x.font='500 64px Manrope'; x.textAlign='left'; x.fillText('Тема урока',60,100); x.font='400 44px Manrope'; x.fillText('Навигация в школе: как найти свой кабинет',60,180); });
  plane(4.5,1.26,0,1.65,-D/2+.075,basic(bt),s);
  // табличка над доской
  plane(1.2,.44,0,2.62,-D/2+.04,basic(signTex(['Кабинет 210'],P.blue,'#fff',384,140,['800 52px Manrope'])),s);
  // окна слева
  [-2.3,1,3.2].forEach(function(z){ box(.05,1.6,1.9,-W/2+.03,1.8,z,new THREE.MeshBasicMaterial({color:0xDCE9F7}),s,false); box(.06,.07,2.0,-W/2+.04,2.64,z,M('#fff'),s,false); box(.06,.07,2.0,-W/2+.04,.96,z,M('#fff'),s,false); });
  // дверь и таблички справа
  box(.08,2.15,1.05,W/2-.05,1.08,2.6,M('#D8C2A2'),s,false);
  plane(.7,.32,W/2-.1,2.42,2.6,basic(signTex(['210'],P.orange,'#fff',256,116,['800 70px Manrope'])),s,-Math.PI/2);
  var poster=tex(512,720,function(x,w,h){ x.fillStyle='#fff'; x.fillRect(0,0,w,h); var cs=[P.blue,P.orange,P.yellow,P.green,P.red,P.blue]; for(var i=0;i<6;i++){ x.fillStyle=cs[i]; x.fillRect(40+(i%2)*226,60+Math.floor(i/2)*180,206,160); }
    x.fillStyle=INK; x.font='800 54px Manrope'; x.textAlign='center'; x.fillText('ПРАВИЛА',w/2,630); });
  plane(1.1,1.55,W/2-.02,1.55,-1.2,basic(poster),s,-Math.PI/2);
  // парты
  var top=M('#F6F7F9'), leg=M('#8A93A1'), ch=[P.blue,P.orange,P.green];
  for(var r=0;r<3;r++) for(var c=0;c<2;c++){ var x=(c?1.9:-1.9)+0, z=-1.2+r*1.7;
    [-0.9,0.9].forEach(function(dx,k){ var cx=x+dx*.0; });
    box(1.6,.05,.6,x,.74,z,top,s); box(.05,.72,.5,x-.7,.37,z,leg,s,false); box(.05,.72,.5,x+.7,.37,z,leg,s,false);
    box(.42,.05,.4,x-.4,.45,z+.55,M(ch[(r+c)%3]),s,false); box(.42,.4,.04,x-.4,.68,z+.77,M(ch[(r+c)%3]),s,false);
    box(.42,.05,.4,x+.4,.45,z+.55,M(ch[(r+c+1)%3]),s,false); box(.42,.4,.04,x+.4,.68,z+.77,M(ch[(r+c+1)%3]),s,false); }
  return {scene:s};
}

/* ——— состояние ——— */
var ext, cor, cls;
var camE=new THREE.PerspectiveCamera(28,1,.1,200), camI=new THREE.PerspectiveCamera(66,1,.05,100);
var mode='ext', busy=false, yaw=.32, pitch=.1, R=46, T=new THREE.Vector3(0,3.2,0);
var iy=0, ip=0, corZ=-1;
var raf=0;
var DEF={
 ext:[ {label:'Вход',col:'blue',pos:[0,1.9,3.8],go:'cor',n:[0,0,1]}, {label:'Кабинет',col:'orange',pos:[4.1,5.2,3.7],go:'cls',n:[0,0,1]},
       {label:'Вывеска',col:'yellow',pos:[-3.6,7.45,3.6],card:['Вывески','Школа №18, Обнинск'],n:[0,0,1]},
       {label:'Мурал',col:'red',pos:[12,3.3,.3],card:['Муралы и роспись стен','Школа «На заре», Малоярославец'],n:[0,0,1]} ],
 cor:[ {label:'Подвесной указатель',col:'blue',pos:[0,2.55,-7.5],card:['Навигационные указатели','Школа «На заре», Малоярославец']},
       {label:'Табличка кабинета',col:'orange',pos:[-1.72,2.42,-6.9],card:['Таблички, навигационные указатели','Школа «На заре», Малоярославец']},
       {label:'Роспись стены',col:'red',pos:[1.76,1.6,-15.6],card:['Муралы и роспись стен','Школа «На заре», Малоярославец']},
       {label:'Номер этажа',col:'yellow',pos:[0,1.6,-33.9],card:['Цвет и номер этажа — часть системы навигации','']} ],
 cls:[ {label:'Табличка кабинета',col:'blue',pos:[0,2.62,-4.22],card:['Таблички, навигационные указатели','Школа «На заре», Малоярославец']},
       {label:'Табличка на двери',col:'orange',pos:[4.1,2.42,2.6],card:['Таблички, навигационные указатели','Школа «На заре», Малоярославец']},
       {label:'Плакат',col:'green',pos:[4.15,1.55,-1.2],card:['Информационные стенды','Школа «На заре», Малоярославец']} ]
};
function setMode(m){ mode=m; clearHS(); DEF[m].forEach(function(d){ addHS(Object.assign({},d)); });
  var inside=m!=='ext'; document.getElementById('back').classList.toggle('on',inside); document.getElementById('hint').textContent=m==='ext'?'Перетаскивайте, чтобы повернуть':(m==='cor'?'Колёсико — идти по коридору, перетаскивайте — осмотреться':'Перетаскивайте, чтобы осмотреться');
  document.getElementById('sub').textContent=m==='ext'?'Нажмите на подписи на здании: зайдите в коридор или кабинет и посмотрите, как работает навигация.':(m==='cor'?'Коридор: указатели, таблички, цвет этажа.':'Кабинет: табличка, плакат, дверь.');
  if(m==='cor'){ iy=0; ip=0; corZ=-1; } if(m==='cls'){ iy=0; ip=0; } }
function cur(){ return mode==='ext'?ext.scene:(mode==='cor'?cor.scene:cls.scene); }
function activeCam(){ return mode==='ext'?camE:camI; }

/* ——— камера ——— */
function placeExtCam(){ var cp=Math.cos(pitch); camE.position.set(T.x+Math.sin(yaw)*cp*R, T.y+Math.sin(pitch)*R, T.z+Math.cos(yaw)*cp*R); camE.lookAt(T); }
function placeIntCam(){ if(mode==='cor') camI.position.set(0,1.6,corZ); else camI.position.set(0,1.55,3.6); camI.rotation.order='YXZ'; camI.rotation.y=iy; camI.rotation.x=ip; }
var drag=null;
stage.addEventListener('pointerdown',function(e){ if(busy) return; drag={x:e.clientX,y:e.clientY}; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove',function(e){ if(!drag) return; var dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if(mode==='ext'){ yaw=Math.max(-.95,Math.min(.95,yaw-dx*.004)); pitch=Math.max(.02,Math.min(.4,pitch+dy*.003)); }
  else { iy=Math.max(-.9,Math.min(.9,iy+dx*.004)); ip=Math.max(-.35,Math.min(.35,ip+dy*.003)); } });
function up(){ drag=null; stage.classList.remove('drag'); } stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
window.addEventListener('wheel',function(e){ if(mode==='cor'&&!busy){ corZ=Math.max(-26,Math.min(-1,corZ-e.deltaY*.012)); e.preventDefault(); } },{passive:false});

/* ——— переходы ——— */
function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function zoomTo(h){ busy=true; hideCard(); var from=camE.position.clone(), to=from.clone().lerp(h.v,.9), t0=performance.now(), T0=T.clone(), look=new THREE.Vector3();
  (function step(){ var k=Math.min(1,(performance.now()-t0)/950), e=ease(k); camE.position.lerpVectors(from,to,e); look.lerpVectors(T0,h.v,e); camE.lookAt(look); camE.fov=28-e*8; camE.updateProjectionMatrix(); if(k>.6) fade.classList.add('on');
    if(k<1) requestAnimationFrame(step); else enter(h.go); })(); }
function enter(m){ wait(380).then(function(){ camE.fov=28; camE.updateProjectionMatrix(); setMode(m); placeIntCam(); resize(); fade.classList.remove('on'); busy=false; }); }
document.getElementById('back').addEventListener('click',function(){ if(busy) return; busy=true; fade.classList.add('on'); wait(380).then(function(){ yaw=.32; pitch=.1; setMode('ext'); fade.classList.remove('on'); busy=false; }); });

/* ——— цикл ——— */
function resize(){ var w=innerWidth,h=innerHeight; renderer.setSize(w,h); camE.aspect=camI.aspect=w/h; camE.updateProjectionMatrix(); camI.updateProjectionMatrix();
  R=w/h<1?78:(w/h<1.4?58:46); }
window.addEventListener('resize',resize);
var vec=new THREE.Vector3(), t0=performance.now();
function frame(){ raf=requestAnimationFrame(frame); var t=(performance.now()-t0)/1000;
  if(!busy){ if(mode==='ext'){ var sway=drag?0:Math.sin(t*.35)*.06; var y0=yaw; yaw+=sway*.01; placeExtCam(); } else placeIntCam(); }
  var cam=activeCam(); renderer.render(cur(),cam);
  HS.forEach(function(h){ vec.copy(h.v).project(cam); var vis=vec.z<1&&vec.z>-1&&Math.abs(vec.x)<1.05&&Math.abs(vec.y)<1.05&&!busy;
    if(vis&&h.n){ var d=new THREE.Vector3().subVectors(cam.position,h.v); if(d.dot(new THREE.Vector3(h.n[0],h.n[1],h.n[2]))<0) vis=false; }
    if(mode!=='ext'&&vis){ var dist=cam.position.distanceTo(h.v); if(dist>20||dist<.5) vis=false; }
    h.el.classList.toggle('hide',!vis); if(vis){ var x=(vec.x*.5+.5)*innerWidth, y=(-vec.y*.5+.5)*innerHeight; h.el.style.transform='translate('+(x-h.el.offsetWidth/2)+'px,'+(y-h.el.offsetHeight/2)+'px)'; } });
  placeCard(); }

Promise.all([document.fonts.load('800 60px Manrope'),document.fonts.load('600 40px Manrope'),document.fonts.load('400 100px "Days One"'),document.fonts.ready]).catch(function(){}).then(function(){
  // текстуры с текстом строятся после загрузки шрифтов
  ext=buildExterior(); cor=buildCorridor(); cls=buildClass();
  setMode('ext'); resize(); placeExtCam(); frame(); });
})();
</script>
</body>
